<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D5" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8B6914" />
    </linearGradient>
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181D" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Luxury Rounded Diamond Shield -->
  <rect x="6" y="6" width="88" height="88" rx="20" fill="url(#darkBg)" stroke="url(#goldGrad)" stroke-width="2.5" />
  <rect x="12" y="12" width="76" height="76" rx="14" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.4" stroke-dasharray="3 3" />
  <!-- Monogram SS -->
  <text x="50" y="64" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="44" font-weight="700" text-anchor="middle" fill="url(#goldGrad)" filter="url(#goldGlow)" letter-spacing="1">SS</text>
</svg>
